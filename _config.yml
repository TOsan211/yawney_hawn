title: Yawney Hawn
description: "Burnt toast, forgotten socks, half-finished plans — quiet essays on the gentle, messy side of everyday life, and the gentle excuses that make it lovable."
author: Yawney Hawn
lang: en
logo: /assets/img/logo.png

# Site has no real articles yet -- keep search engines from indexing
# anything until there's actual content. Flip to false (or remove) once
# ready to go live.
noindex: true

url: "https://TOsan211.github.io"
baseurl: ""

markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

# jekyll-seo-tag's og:image/twitter:image only ever reads a page's own
# `image:` front matter (see jekyll-seo-tag/image_drop.rb) -- it does NOT
# fall back to `logo:` above. This default gives every page/post a social
# preview image unless the page sets its own `image:`.
# NOTE: this `image:` is for social-share purposes only. The post card
# grid (_includes/post-list.html) intentionally reads a separate
# `thumbnail:` front matter key instead of `image:`, so this sitewide
# default doesn't make every card show the same generic banner -- add
# `thumbnail:` per-post once real post photos exist.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/Banner.png

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

sass:
  style: compressed

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  title: ":title - page :num"
  sort_field: "date"
  sort_reverse: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
