title: Yawney Hawn
description: The Yawney Hawn blog
author: Yawney Hawn
lang: en

# Site has no real articles yet -- keep search engines from indexing
# anything until there's actual content. Flip to false (or remove) once
# ready to go live.
noindex: true

url: "https://TOsan211.github.io"
baseurl: ""

markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

sass:
  style: compressed

pagination:
  enabled: true
  per_page: 2
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
