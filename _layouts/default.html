<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RCG886F77G"></script>
  <script src="{{ '/assets/js/gtag-init.js' | relative_url }}"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  {% if site.noindex or paginator.page > 1 %}
  <meta name="robots" content="noindex, follow">
  {% endif %}
  {% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/assets/img/favicon-16x16.png' | relative_url }}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" sizes="180x180">
  <link rel="preload" href="{{ '/assets/fonts/asap-condensed-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/asap-condensed-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/reset.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body{% if page.layout == 'home' %} class="is-home"{% endif %}>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  {% include social-x.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
